[project]
name = "robonix-zc"
version = "0.1.0"
description = "Python lifecycle helpers for Robonix zero-copy shared memory"
license = "MulanPSL-2.0"
requires-python = ">=3.10"
# ROS Python packages are provided by the sourced ROS 2 environment, not PyPI.
# Keep rclpy/sensor_msgs/std_msgs out of uv resolution.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
